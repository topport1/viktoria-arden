<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Бесплатный тест — Виктория Арден</title>
<link rel="stylesheet" href="style.css?v=1790992092">
<script src="config.js?v=1790992092"></script>
<style>
body{background:var(--dark);color:#efe6d8;min-height:100vh}
.q{max-width:640px;margin:0 auto;padding:40px 20px 80px}
.q .logo{text-align:center;margin-bottom:40px}
.bar{height:2px;background:#33291f;margin-bottom:34px}
.bar i{display:block;height:100%;background:var(--gold);width:0;transition:width .3s}
.q h1{font-size:clamp(32px,6vw,44px);text-align:center;margin-bottom:16px}
.q .sub{text-align:center;color:#c4b49c;margin-bottom:34px}
.q .step{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:14px}
.q h2{font-size:clamp(26px,4.6vw,34px);margin-bottom:26px;color:#efe6d8}
.opt{display:block;width:100%;text-align:left;background:#211913;color:#efe6d8;border:1px solid #3a2f26;padding:18px 20px;margin-bottom:12px;font:inherit;font-size:16px;cursor:pointer;border-radius:2px;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold);background:#2a2018}
.res .type{font-family:'Cormorant Garamond',serif;font-size:clamp(34px,6vw,48px);color:var(--gold2);line-height:1.05;margin:6px 0 20px}
.res p{color:#d6c8b3;margin-bottom:14px}
.res .box{border:1px solid var(--gold);padding:26px;margin:30px 0 10px;background:#1d1611}
.res .box h3{font-size:28px;margin-bottom:8px}
.res .center{text-align:center}
.res .small{font-size:13px;color:#a59683;margin-top:14px;text-align:center}
.hidden{display:none}
</style>
</head>
<body>
<div class="q">
  <div class="logo serif" style="font-size:22px;letter-spacing:.08em">Виктория Арден</div>
  <div id="intro">
    <div class="eyebrow" style="text-align:center">Бесплатный тест · 2 минуты</div>
    <h1 id="t-title"></h1>
    <p class="sub" id="t-sub"></p>
    <div style="text-align:center"><button class="btn" id="start">Начать тест</button></div>
  </div>
  <div id="quiz" class="hidden"><div class="bar"><i id="bar"></i></div><div class="step" id="step"></div><h2 id="qtext"></h2><div id="opts"></div></div>
  <div id="result" class="res hidden"></div>
</div>
<script>
const TESTS = {
  kapital: {
    title: 'Какой у тебя денежный потолок?',
    sub: '6 вопросов. Отвечай честно, первое, что приходит в голову. В конце узнаешь, что именно держит твой доход на месте.',
    qs: [
      ['Тебе предлагают работу с доходом в два раза выше. Первая мысль:', ['Подруге нужнее, пусть она попробует','Я ещё недостаточно хороша для этого','А вдруг не справлюсь и потеряю то, что есть','Отлично, когда начинаем?']],
      ['Неожиданно пришли 50 000 ₽. Что ты сделаешь?', ['Помогу близким, у них сейчас трудно','Закрою текущие расходы, их всегда много','Отложу и не буду трогать, мало ли что','Часть отложу, часть вложу в себя или дело']],
      ['Клиент или начальник спрашивает, сколько ты хочешь. Ты:', ['Говорю «сколько не жалко»','Называю меньше, чем хотела, чтобы не отпугнуть','Называю цену, но сразу оправдываюсь','Называю цену и молчу']],
      ['Как ты относишься к богатым женщинам?', ['Им просто повезло или кто-то помог','Они много работают, у меня так не получится','Большие деньги — это всегда риск и проблемы','Интересно, как они это сделали']],
      ['Подруга просит в долг уже третий раз. Ты:', ['Даю, она же подруга','Даю и молча переживаю','Отказываю, но потом чувствую вину','Спокойно отказываю']],
      ['Какая фраза про тебя?', ['«Сначала другие, потом я»','«Я работаю больше всех, а получаю меньше»','«Главное, чтобы стабильно»','«Я хочу расти, и мне не стыдно»']]
    ],
    types: [
      {name:'Спасательница', text:['Твой денежный потолок — это другие люди. Ты щедрая и надёжная, и именно поэтому деньги у тебя не задерживаются: они уходят туда, где «нужнее».','Тебе кажется, что хотеть денег для себя — эгоистично. Но пока ты на последнем месте в собственном бюджете, твой доход будет расти только у окружающих.'], rules:'Правила 1, 11 и 12 в книге — именно про тебя: как поставить себя на первое место и при этом остаться хорошим человеком.'},
      {name:'Тихая отличница', text:['Ты много работаешь, всё делаешь качественно и ждёшь, что это заметят и оценят. Но деньги не приходят за старание. Они приходят к тем, кто их просит.','Твой потолок — страх назвать свою цену. Ты снижаешь её сама, ещё до того, как кто-то попросил.'], rules:'Правила 9 и 6 научат называть цену и держать паузу, а правило 17 — говорить коротко и без оправданий.'},
      {name:'Хранительница стабильности', text:['Для тебя главное — чтобы не стало хуже. Это разумно, но у этой осторожности есть цена: ты держишься за то, что есть, и не пускаешь в жизнь большее.','Твой потолок — привычка жить в режиме выживания. Ты видишь риск там, где другие видят возможность.'], rules:'Правило 10 «Как я могу себе это позволить?» и правило 12 про собственную безопасность покажут, как расти, не теряя опоры.'},
      {name:'Готова к росту', text:['У тебя здоровое отношение к деньгам и смелость хотеть большего. Потолок у тебя не в голове, а в привычках, которые остались с прошлых времён.','Небольшие, но точные изменения дадут тебе заметный рывок в ближайшие месяцы.'], rules:'Обрати внимание на правила 11 «Плати сначала себе» и 19 «Окружение — это твой потолок»: они помогут закрепить рост.'}
    ]
  },
  cennost: {
    title: 'Что мешает тебе встретить своего мужчину?',
    sub: '6 вопросов про то, как ты ведёшь себя в отношениях. В конце узнаешь, какая установка притягивает к тебе не тех.',
    qs: [
      ['Мужчина предлагает оплатить ужин. Ты:', ['Предлагаю поделить, мне неудобно','Говорю «я сама», я независимая','Соглашаюсь, но жду подвоха','Говорю «спасибо» и улыбаюсь']],
      ['Он пишет в 23:00 «Ты где? Давай увидимся». Ты:', ['Отменяю планы и еду','Пишу «я занята», хотя сижу дома','Отвечаю через пару часов, чтобы не выглядеть доступной','Отвечаю, когда мне удобно, и предлагаю время']],
      ['Где ты обычно знакомишься?', ['Где получится: работа, друзья друзей','Я не знакомлюсь, у меня нет времени','Жду, что он сам меня найдёт','Выбираю места, где бывают интересные мне мужчины']],
      ['В отношениях ты чаще всего:', ['Забочусь, решаю, подстраиваюсь','Всё тяну сама, на него не рассчитываю','Проверяю, любит ли он меня на самом деле','Даю и принимаю примерно поровну']],
      ['Он забыл о важной для тебя дате. Ты:', ['Промолчу, не хочу ссоры','Скажу, что мне всё равно','Обижусь и буду ждать, когда догадается','Спокойно скажу, что мне неприятно']],
      ['Какая фраза про тебя?', ['«Я всё для него, а он…»','«Мне никто не нужен»','«Нормальных мужчин не осталось»','«Я знаю, чего хочу»']]
    ],
    types: [
      {name:'Удобная', text:['Ты отдаёшь очень много: заботу, время, понимание. Но мужчина, которому не нужно стараться, перестаёт стараться.','Твоя установка звучит так: «Меня полюбят, если я буду удобной». К такой женщине тянутся те, кому нужна удобная жизнь, а не она сама.'], rules:'Правила 13, 14 и 16 — твои главные: как перестать подстраиваться и при этом остаться тёплой.'},
      {name:'Сильная, которая всё сама', text:['Ты умеешь всё и ни от кого не зависишь. Это твоя сила и одновременно стена: мужчине рядом с тобой просто нечего делать.','Твоя установка: «Рассчитывать можно только на себя». Достойные мужчины чувствуют, что им здесь не место, и проходят мимо.'], rules:'Правило 13 «Умей принимать» — первое, с чего стоит начать. Затем правило 16 про то, что доказывать ничего не нужно.'},
      {name:'Ожидающая', text:['Ты ждёшь, что правильный мужчина появится сам и сам всё поймёт. А пока проверяешь тех, кто рядом, и разочаровываешься.','Твоя установка: «Если он тот самый, он догадается». Но достойные мужчины не умеют читать мысли. Они реагируют на ясные сигналы.'], rules:'Правило 15 «Выбирай сама» и правило 8 «Люди делают то, что ты разрешаешь» покажут, как перестать ждать и начать выбирать.'},
      {name:'Почти готова', text:['У тебя здоровые представления об отношениях и уважение к себе. Тебе осталось немного: расширить круг и позволить себе проявлять интерес первой.','Твоя установка почти рабочая, её нужно лишь закрепить в действиях.'], rules:'Обрати внимание на правила 15 и 19: новое окружение быстро приведёт тебя к нужным людям.'}
    ]
  },
  status: {
    title: 'Что мешает тебе чувствовать себя достойной?',
    sub: '6 вопросов про уверенность. В конце узнаешь, какая установка снижает твою цену в глазах других и в твоих собственных.',
    qs: [
      ['Тебе говорят: «Ты сегодня прекрасно выглядишь». Ты отвечаешь:', ['«Да брось, я даже не накрашена»','«Спасибо… а что, обычно плохо?»','Смущаюсь и перевожу тему','«Спасибо, мне приятно»']],
      ['На совещании или в компании ты:', ['Молчу, вдруг скажу глупость','Говорю много, чтобы доказать, что я в теме','Слежу за реакцией каждого','Говорю, когда есть что сказать']],
      ['Тебя попросили о том, чего ты делать не хочешь. Ты:', ['Соглашаюсь, чтобы не обидеть','Отказываю с длинным объяснением','Соглашаюсь, а потом злюсь','Говорю «нет, мне это не подходит»']],
      ['После встречи ты чаще всего:', ['Вспоминаю, что сказала не так','Думаю, достаточно ли хорошо себя показала','Прокручиваю, как на меня посмотрели','Думаю о своих делах']],
      ['Как часто ты извиняешься, когда ничего плохого не сделала?', ['Постоянно','Часто, особенно на работе','Иногда, когда чувствую напряжение','Почти никогда']],
      ['Какая фраза про тебя?', ['«Лучше быть незаметной»','«Я должна быть лучшей, иначе меня не ценят»','«Мне важно, что обо мне думают»','«Я знаю себе цену»']]
    ],
    types: [
      {name:'Тень', text:['Ты привыкла быть незаметной: не высовываться, не занимать много места, не мешать. Так когда-то было безопаснее.','Твоя установка: «Меня не должно быть слишком много». Но люди оценивают тебя ровно так, как ты подаёшь себя сама, то есть очень скромно.'], rules:'Начни с правил 2 «Не спорь с комплиментом» и 3 «Перестань извиняться». Это самые быстрые шаги к другому ощущению себя.'},
      {name:'Отличница-доказательница', text:['Ты всё время доказываешь, что достойна: больше работаешь, больше знаешь, больше делаешь. И очень устаешь.','Твоя установка: «Меня ценят только за результат». Но уверенность — это не количество доказательств, а спокойствие без них.'], rules:'Правила 16 «Не доказывай» и 17 «Говори коротко» помогут перестать бежать и начать стоять уверенно.'},
      {name:'Сканер чужих реакций', text:['Ты очень чувствительна к людям и замечаешь каждый взгляд и интонацию. Но эта чуткость обернулась против тебя: ты живёшь в чужих головах, а не в своей.','Твоя установка: «Моя ценность зависит от того, что думают другие». Это отнимает силы и делает тебя зависимой от одобрения.'], rules:'Правило 18 «Перестань сканировать чужую реакцию» и правило 6 «Держи паузу» — твой главный инструмент.'},
      {name:'Уверенная', text:['У тебя здоровая самооценка, и ты умеешь себя подать. Иногда в напряжённых ситуациях старые привычки возвращаются, но ты уже знаешь себе цену.','Тебе осталось закрепить это в деньгах и отношениях, где цена особенно заметна.'], rules:'Обрати внимание на разделы «Деньги» и «Мужчины»: правила 9 и 13 помогут перенести уверенность туда, где она приносит больше всего.'}
    ]
  }
};
const key = new URLSearchParams(location.search).get('t') || 'kapital';
const T = TESTS[key] || TESTS.kapital;
const $ = id => document.getElementById(id);
$('t-title').textContent = T.title; $('t-sub').textContent = T.sub;
let i = 0, score = [0,0,0,0];
function show(){
  const [q, opts] = T.qs[i];
  $('step').textContent = `Вопрос ${i+1} из ${T.qs.length}`;
  $('bar').style.width = (i / T.qs.length * 100) + '%';
  $('qtext').textContent = q;
  const order = [0,1,2,3].sort(() => Math.random() - .5);
  $('opts').innerHTML = '';
  order.forEach(k => { const b = document.createElement('button'); b.className = 'opt'; b.textContent = opts[k]; b.onclick = () => { score[k]++; i++; i < T.qs.length ? show() : result(); }; $('opts').appendChild(b); });
}
function result(){
  const best = score.indexOf(Math.max(...score));
  const r = T.types[best];
  $('quiz').classList.add('hidden');
  $('result').classList.remove('hidden');
  $('result').innerHTML = `<div class="eyebrow">Твой результат</div><div class="type">${r.name}</div>${r.text.map(p=>`<p>${p}</p>`).join('')}
  <div class="box"><h3>Что с этим делать</h3><p>${r.rules}</p><p>В книге «20 правил женщины, которая стоит дорого» к каждому правилу есть готовая фраза и короткая практика, которую можно сделать уже сегодня.</p>
  <div class="center" style="margin-top:22px"><a class="btn" href="index.html#price">${/ЗАМЕНИТЬ/.test(SITE.buyUrl)?'Узнать о книге':'Забрать книгу за 990&nbsp;₽'}</a></div></div>
  <p class="small">Тест носит развлекательно-образовательный характер и не является психологической диагностикой. Виктория Арден — ИИ-персонаж.</p>`;
  window.scrollTo(0,0);
}
$('start').onclick = () => { $('intro').classList.add('hidden'); $('quiz').classList.remove('hidden'); show(); };
</script>
</body>
</html>
